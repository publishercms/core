name: publisher-cms
services:
  db:
    image: postgres:15-alpine
    container_name: core-db
    environment:
      POSTGRES_DB: cms_dev
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./packages/admin
      dockerfile: Dockerfile
    container_name: admin
    depends_on:
      api:
        condition: service_started
    ports:
      - "8002:8002"
    volumes:
    - ./packages/admin:/app
    - /app/node_modules

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://cms:cms@db:5432/cms_dev
      NODE_ENV: development
      PORT: 8001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./packages/api:/app
      - ./development/config:/app/config
      - ./development/plugins:/app/plugins
      - /app/node_modules

  proxy:
    image: nginx:alpine
    volumes:
      - ./development/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_started
      admin:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:9.5
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  db_data:
  pgadmin_data:
